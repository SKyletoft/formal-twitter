name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: nixos/nix:latest
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
    steps:
      - uses: actions/checkout@v4
      - run: nix build -L .#ci-agda
      - run: nix build -L .#ci-backend
