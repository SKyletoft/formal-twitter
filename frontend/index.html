<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Formal Twitter</title>
	<link rel="stylesheet" href="style.css">
	<script src="app.js" defer></script>
</head>
<body>
	<header class="site-header">
		<div class="wrap header-row">
			<h1 class="wordmark"><a href="#/">Formal Twitter</a></h1>

			<div class="session">
				<form id="auth-form" class="auth-form">
					<div class="auth-field">
						<label for="username">Username</label>
						<input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
					</div>
					<div class="auth-field">
						<label for="password">Password</label>
						<input id="password" name="password" type="password" autocomplete="current-password" required>
					</div>
					<div class="auth-actions">
						<button type="submit" id="login-button">Log in</button>
						<button type="submit" id="signup-button" class="secondary">Sign up</button>
					</div>
				</form>

				<p id="signed-in" class="signed-in" hidden>
					<span class="signed-in-name">Signed in as <strong id="session-username">@</strong></span>
					<button type="button" id="logout-button" class="secondary">Log out</button>
				</p>
			</div>
		</div>

		<nav class="tabs wrap" aria-label="Timelines">
			<a href="#/" id="tab-global" class="tab">Global</a>
			<a href="#/following" id="tab-following" class="tab">Following</a>
			<span id="following-hint" class="tab-hint">log in to see the following timeline</span>
		</nav>
	</header>

	<p id="banner" class="banner" role="status" aria-live="polite" hidden></p>

	<main class="wrap">
		<section id="timeline-view" aria-labelledby="timeline-heading">
			<h2 id="timeline-heading">Global</h2>
			<form id="composer" class="composer" hidden>
				<label class="composer-label" for="post-text">New tweet</label>
				<div class="composer-row">
					<input id="post-text" name="post-text" type="text" autocomplete="off" spellcheck="false" required>
					<button type="submit" id="post-button">Post</button>
				</div>
				<p class="composer-hint">One line only: the API takes the text as a single field.</p>
				<p id="post-status" class="status" role="status" aria-live="polite"></p>
			</form>
			<p id="timeline-status" class="status" role="status" aria-live="polite"></p>
			<ol id="timeline" class="timeline"></ol>
		</section>

		<section id="detail-view" aria-labelledby="detail-heading" hidden>
			<p class="back"><a id="detail-back" href="#/">← Back to Global</a></p>
			<h2 id="detail-heading">Tweet</h2>
			<p id="detail-status" class="status" role="status" aria-live="polite"></p>
			<div id="detail-tweet" class="detail-tweet"></div>
			<form id="reply-composer" class="composer" hidden>
				<label class="composer-label" for="reply-text">Reply</label>
				<div class="composer-row">
					<input id="reply-text" name="reply-text" type="text" autocomplete="off" spellcheck="false" required>
					<button type="submit" id="reply-button">Reply</button>
				</div>
				<p class="composer-hint">One line only: the API takes the text as a single field.</p>
				<p id="reply-status" class="status" role="status" aria-live="polite"></p>
			</form>
			<h3 id="replies-heading">Replies</h3>
			<ol id="detail-replies" class="timeline" aria-labelledby="replies-heading"></ol>
			<p id="replies-note" class="status"></p>
		</section>
	</main>

	<footer class="wrap site-footer">
		<details id="activity" class="activity">
			<summary>Activity (<span id="log-count">0</span>)</summary>
			<ul id="log" class="log" aria-live="polite" aria-label="Activity log"></ul>
		</details>
	</footer>
</body>
</html>
